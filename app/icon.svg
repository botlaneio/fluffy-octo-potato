<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon. Colours are literal rather than tokens: this file is served
       standalone to the browser, outside the page's CSS.

       The tile matches the site ground so the mark reads the same here as it
       does in the header. The threshold rule is dropped — it is the first
       thing to go at 16px, and the two bars plus the block carry the
       silhouette without it. -->
  <rect width="32" height="32" rx="7" fill="#070708"/>
  <g transform="translate(16 16) scale(0.72) translate(-16 -16)">
    <rect x="4" y="3" width="3.6" height="26" rx="1.8" fill="#f2f2f4"/>
    <rect x="24.4" y="3" width="3.6" height="26" rx="1.8" fill="#f2f2f4"/>
    <rect x="11.6" y="6.4" width="8.8" height="8.8" rx="2.4" fill="#3b82f6"/>
  </g>
</svg>
